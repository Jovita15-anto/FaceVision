[project]
name = "facevision"
version = "0.1.0"
description = "Face detection and identity classification with MTCNN and VGG-16, served through Streamlit."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit",
    "mtcnn",
    "tensorflow",
    "opencv-python-headless",
    "pillow",
    "numpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/facevision"]
